<svg viewBox="0 0 420 340" xmlns="http://www.w3.org/2000/svg">
  <style>
    .barra { transform-box: fill-box; transform-origin: bottom; animation: crescer 2.4s ease-in-out infinite; }
    .barra:nth-child(1) { animation-delay: 0s; }
    .barra:nth-child(2) { animation-delay: 0.15s; }
    .barra:nth-child(3) { animation-delay: 0.3s; }
    .barra:nth-child(4) { animation-delay: 0.45s; }
    .barra:nth-child(5) { animation-delay: 0.6s; }
    .barra:nth-child(6) { animation-delay: 0.75s; }
    @keyframes crescer {
      0%, 100% { transform: scaleY(0.7); }
      50%      { transform: scaleY(1); }
    }

    .donut { transform-box: fill-box; transform-origin: center; animation: girar 8s linear infinite; }
    @keyframes girar {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    .linha { animation: pulsar 3s ease-in-out infinite; }
    .linha:nth-child(odd) { animation-delay: 0.4s; }
    @keyframes pulsar {
      0%, 100% { fill-opacity: 0.22; }
      50%      { fill-opacity: 0.4; }
    }
  </style>

  <rect x="0" y="0" width="420" height="340" rx="16" fill="#ffffff" fill-opacity="0.14"/>
  <rect x="0" y="0" width="420" height="40" rx="16" fill="#ffffff" fill-opacity="0.18"/>
  <circle cx="22" cy="20" r="5" fill="#ffffff" fill-opacity="0.6"/>
  <circle cx="40" cy="20" r="5" fill="#ffffff" fill-opacity="0.6"/>
  <circle cx="58" cy="20" r="5" fill="#ffffff" fill-opacity="0.6"/>

  <!-- sidebar -->
  <g fill="#ffffff">
    <rect class="linha" x="20" y="60" width="90" height="14" rx="7" fill-opacity="0.22"/>
    <rect class="linha" x="20" y="86" width="90" height="14" rx="7" fill-opacity="0.22"/>
    <rect class="linha" x="20" y="112" width="90" height="14" rx="7" fill-opacity="0.22"/>
    <rect class="linha" x="20" y="138" width="65" height="14" rx="7" fill-opacity="0.22"/>
    <rect class="linha" x="20" y="164" width="90" height="14" rx="7" fill-opacity="0.22"/>
    <rect class="linha" x="20" y="190" width="90" height="14" rx="7" fill-opacity="0.22"/>
    <rect class="linha" x="20" y="216" width="65" height="14" rx="7" fill-opacity="0.22"/>
    <rect class="linha" x="20" y="242" width="90" height="14" rx="7" fill-opacity="0.22"/>
  </g>

  <!-- donut 1 -->
  <g class="donut" transform="translate(190,120)">
    <circle r="42" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="16"/>
    <circle r="42" fill="none" stroke="#ffd166" stroke-width="16" stroke-dasharray="140 264" stroke-linecap="round" transform="rotate(-90)"/>
    <circle r="42" fill="none" stroke="#ff8a70" stroke-width="16" stroke-dasharray="90 264" stroke-dashoffset="-140" stroke-linecap="round" transform="rotate(-90)"/>
  </g>

  <!-- donut 2 -->
  <g class="donut" transform="translate(320,120)" style="animation-direction:reverse;">
    <circle r="42" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="16"/>
    <circle r="42" fill="none" stroke="#ffffff" stroke-width="16" stroke-dasharray="200 264" stroke-linecap="round" transform="rotate(-90)"/>
  </g>

  <!-- barras -->
  <g fill-opacity="0.85">
    <rect class="barra" x="150" y="270" width="20" height="40" rx="4" fill="#ff8a70"/>
    <rect class="barra" x="185" y="250" width="20" height="60" rx="4" fill="#ffd166"/>
    <rect class="barra" x="220" y="286" width="20" height="24" rx="4" fill="#ffffff"/>
    <rect class="barra" x="255" y="230" width="20" height="80" rx="4" fill="#ff8a70"/>
    <rect class="barra" x="290" y="260" width="20" height="50" rx="4" fill="#ffd166"/>
    <rect class="barra" x="325" y="270" width="20" height="40" rx="4" fill="#ffffff"/>
  </g>
</svg>
